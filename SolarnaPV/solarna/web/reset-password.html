<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073b41">
  <link rel="icon" href="/favicon.svg?v=44" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=44">
  <link rel="stylesheet" href="/app.css?v=44">
  <title>Reset password · Solarna Systems</title>
</head>
<body class="auth-page web-shell">
  <main class="auth-shell">
    <section class="login-card" aria-labelledby="reset-title">
      <a class="auth-brand" href="/" aria-label="Solarna Systems">
        <img src="/solarna-mark.svg?v=44" alt="" width="52" height="52">
        <span>Solarna Systems</span>
      </a>
      <label class="auth-language">
        <span data-i18n="language">Language</span>
        <select data-language-select>
          <option value="en" data-i18n="language_en">English</option>
          <option value="fr" data-i18n="language_fr">Français</option>
          <option value="ar" data-i18n="language_ar">العربية</option>
        </select>
      </label>
      <div>
        <p class="eyebrow">Solarna PV</p>
        <h1 id="reset-title" data-i18n="new_password">Set new password</h1>
      </div>
      <form id="reset-form" class="login-form">
        <label>
          <span data-i18n="new_password">New password</span>
          <input id="new-password" type="password" minlength="8" maxlength="512"
                 autocomplete="new-password" required autofocus>
        </label>
        <label>
          <span data-i18n="confirm_password">Confirm password</span>
          <input id="confirm-password" type="password" minlength="8" maxlength="512"
                 autocomplete="new-password" required>
        </label>
        <button id="reset-button" class="button primary" type="submit">
          <span data-i18n="save_password">Save password</span>
        </button>
      </form>
      <p id="reset-status" class="hint" aria-live="polite"></p>
      <a class="auth-link" href="/login.html" data-i18n="back_login">Back to login</a>
    </section>
  </main>
  <script src="/config.js?v=44"></script>
  <script src="/i18n.js?v=44"></script>
  <script src="/supabase-client.js?v=44"></script>
  <script src="/reset-password.js?v=44" defer></script>
</body>
</html>

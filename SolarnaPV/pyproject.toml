[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarna-pv"
version = "0.5.0"
description = "Transparent fixed-PV orientation optimization, starting in Sfax"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pvlib==0.16.1", "numpy>=1.26,<3", "pandas>=3.0.6,<4"]

[project.scripts]
solarna = "solarna.__main__:main"
solarna-app = "solarna.app:main"
solarna-validate = "solarna.validation:main"

[tool.setuptools.packages.find]
include = ["solarna*"]

[tool.setuptools.package-data]
solarna = ["web/*"]
